<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Friends City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Unbounded:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#14132b;--paper:#f6efe6;--peach:#ffb27a;--mint:#7fe0c4}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:Onest,system-ui,sans-serif;color:var(--paper)}
canvas{display:block}
#join{position:fixed;inset:0;display:flex;align-items:flex-end;padding:6vh 6vw;background:linear-gradient(90deg,rgba(20,19,43,.82),rgba(20,19,43,0) 60%)}
#join form{max-width:380px}
#join h1{font-family:Unbounded,sans-serif;font-weight:600;font-size:clamp(34px,6vw,64px);line-height:1;margin:0 0 14px}
#join p{margin:0 0 22px;font-size:17px;line-height:1.5;opacity:.88}
#join input{width:100%;padding:14px 16px;border-radius:10px;border:2px solid rgba(246,239,230,.35);background:rgba(20,19,43,.6);color:var(--paper);font:inherit;font-size:17px;outline:none}
#join input:focus-visible{border-color:var(--mint)}
#join button{margin-top:12px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--peach);color:var(--ink);font:600 17px Onest,sans-serif;cursor:pointer}
#join button:hover{filter:brightness(1.07)}
#join button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#hud .tip{position:absolute;top:16px;left:16px;padding:10px 14px;border-radius:10px;background:rgba(20,19,43,.6);font-size:14px;line-height:1.6;backdrop-filter:blur(6px)}
#hud .online{position:absolute;top:16px;right:16px;padding:10px 14px;border-radius:10px;background:rgba(20,19,43,.6);font-size:14px}
#chat{position:absolute;left:16px;bottom:16px;width:min(420px,calc(100vw - 32px))}
#log{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
#log b{color:var(--mint)}
#chat input{pointer-events:auto;width:100%;padding:10px 12px;border-radius:10px;border:2px solid transparent;background:rgba(20,19,43,.6);color:var(--paper);font:inherit;outline:none}
#chat input:focus{border-color:var(--peach)}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.8);display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#join #regBtn{background:transparent;color:var(--paper);border:2px solid rgba(246,239,230,.4)}
#hint{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:rgba(20,19,43,.75);font-size:16px;display:none}
#editor{position:absolute;right:16px;top:70px;width:250px;padding:16px;border-radius:12px;background:rgba(20,19,43,.85);pointer-events:auto;display:none;backdrop-filter:blur(6px)}
#editor h3{margin:0 0 12px;font:600 15px Unbounded,sans-serif}
#editor .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
#editor .row span{width:100%;font-size:14px;opacity:.8}
#editor .sw button{width:30px;height:30px;border-radius:8px;border:2px solid rgba(255,255,255,.5);cursor:pointer}
#editor .fl button,#editor #edDone{padding:8px 14px;border-radius:8px;border:0;background:var(--mint);color:var(--ink);font:600 14px Onest,sans-serif;cursor:pointer}
#editor #edDone{background:var(--peach);width:100%}
#editor{max-height:calc(100vh - 100px);overflow:auto}
#editor .ty button{padding:6px 10px;border-radius:8px;border:2px solid rgba(255,255,255,.35);background:transparent;color:var(--paper);font:14px Onest,sans-serif;cursor:pointer}
#editor .ty button.on{background:var(--mint);color:var(--ink);border-color:var(--mint)}
#editor #edDel{width:100%;margin-bottom:8px;padding:8px;border-radius:8px;border:2px solid #e8715f;background:transparent;color:#ff9c8c;font:600 14px Onest,sans-serif;cursor:pointer}
#btns{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;pointer-events:auto}
#btns button{padding:10px 14px;border-radius:10px;border:0;background:rgba(20,19,43,.75);color:var(--paper);font:600 14px Onest,sans-serif;cursor:pointer}
#btns button:hover{background:var(--peach);color:var(--ink)}
#btns button:focus-visible{outline:3px solid var(--mint)}
#hint{pointer-events:auto;cursor:pointer}
#stick{position:absolute;left:28px;bottom:48px;width:120px;height:120px;border-radius:50%;background:rgba(20,19,43,.45);border:2px solid rgba(246,239,230,.4);pointer-events:auto;touch-action:none;user-select:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(246,239,230,.85)}
#jumpBtn{position:absolute;right:20px;bottom:140px;width:78px;height:78px;border-radius:50%;border:2px solid rgba(246,239,230,.5);background:rgba(255,178,122,.85);color:#14132b;font:600 14px Onest,sans-serif;pointer-events:auto;touch-action:none}
body.touch .tip{display:none}
body.touch #chat{top:56px;bottom:auto;left:12px;width:min(300px,58vw);display:flex;flex-direction:column-reverse}
body.touch #chat input{font-size:16px}
body.touch #btns{flex-wrap:wrap;justify-content:flex-end;max-width:62vw;bottom:12px;right:12px}
body.touch #hint{bottom:170px}
body.touch #editor{top:56px;max-height:calc(100vh - 80px)}
#zoom{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#zoom button{width:44px;height:44px;border-radius:50%;border:0;background:rgba(20,19,43,.75);color:var(--paper);font:600 24px Onest,sans-serif;cursor:pointer;touch-action:none;user-select:none}
#zoom button:hover{background:var(--peach);color:var(--ink)}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="join"><form id="joinForm">
  <h1>Friends City</h1>
  <p>Общий город для своих. Заходите в любое время: друзья уже гуляют по площади.</p>
  <input id="name" maxlength="16" placeholder="Имя" autocomplete="username" required>
  <input id="pass" type="password" maxlength="64" placeholder="Пароль" autocomplete="current-password" required style="margin-top:10px">
  <div id="authErr" role="alert" style="min-height:22px;margin-top:8px;color:#ffb27a;font-size:14px"></div>
  <button type="submit">Войти</button>
  <button type="button" id="regBtn">Создать аккаунт</button>
</form></div>
<div id="hud">
  <div class="tip">WASD — идти · Shift — бежать · Пробел — прыжок · мышь — камера<br>V — от первого лица · N — день и ночь · Enter — чат</div>
  <div class="online" id="online"></div>
  <div id="cross"></div>
  <div id="hint"></div>
  <div id="zoom"><button id="zin" type="button" aria-label="Приблизить">+</button><button id="zout" type="button" aria-label="Отдалить">−</button></div>
  <div id="btns"><button id="homeBtn" type="button">К моему дому (H)</button><button id="inviteBtn" type="button">Пригласить друзей</button></div>
  <div id="editor">
    <h3>Ваш дом</h3>
    <div class="row ty" id="typeBox"><span>Тип постройки</span></div>
    <div class="row sw" id="wallSw"><span>Стены</span></div>
    <div class="row sw" id="roofSw"><span>Крыша</span></div>
    <div class="row fl" id="flRow"><span>Этажи</span><button id="fl1" type="button">1</button><button id="fl2" type="button">2</button></div>
    <button id="edDel" type="button">Снести дом</button>
    <button id="edDone" type="button">Готово</button>
  </div>
  <div id="chat"><div id="log"></div><input id="chatInput" maxlength="200" placeholder="Нажмите Enter, чтобы написать" autocomplete="off"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
